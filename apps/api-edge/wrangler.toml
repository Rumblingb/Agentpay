name = "agentpay-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Production environment (default) ─────────────────────────────────────────
[vars]
# Comma-separated list of allowed CORS origins.
# Add new origins here (no trailing slashes).  Vercel preview URLs
# (https://<agentpay|apay>-*.vercel.app) are allowed automatically by the
# cors middleware and do not need to be listed here.
CORS_ORIGIN = "https://apay-delta.vercel.app,https://dashboard.agentpay.gg,https://agentpay.gg,https://agentpay.so,https://app.agentpay.so"
API_BASE_URL = "https://api.agentpay.so"
FRONTEND_URL = "https://agentpay.so"
NODE_ENV = "production"
# Cartesia TTS — default voice (British English, Sonic). Non-sensitive; override per-env if needed.
# Set the secret separately: npx wrangler secret put CARTESIA_API_KEY
CARTESIA_DEFAULT_VOICE_ID = "694f9389-aac1-45b6-b726-9d9369183238"

# Provider-neutral payments — deny-by-default. Live stays off until explicit enablement.
AGENTPAY_PAYMENT_MODE = "sandbox"
AGENTPAY_LIVE_PAYMENTS_ENABLED = "false"
AGENTPAY_PAYMENTS_ENABLED = "false"
AGENTPAY_ALLOWED_PAYMENT_PROVIDERS = "stripe,airwallex,x402"
AGENTPAY_ALLOWED_PAYMENT_CURRENCIES = "USD,GBP,EUR"
AGENTPAY_ALLOWED_PAYMENT_REDIRECT_HOSTS = "agentpay.so,app.agentpay.so,dashboard.agentpay.gg"
AGENTPAY_MAX_PAYMENT_MINOR = "10000"
AGENTPAY_MAX_DAILY_PAYMENT_MINOR = "50000"

# Custom domain — api.agentpay.so
[[routes]]
pattern = "api.agentpay.so"
custom_domain = true

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "be606bac9fde4493b21fff2e085eb82c"

[ai]
binding = "AI"

# Server-funded GPT compiler quotas. These counters are location-local and
# eventually consistent, so the OpenAI project budget remains the hard ceiling.
[[ratelimits]]
name = "COMMERCE_COMPILER_SHOPPER_LIMITER"
namespace_id = "2026071801"

[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "COMMERCE_COMPILER_MERCHANT_LIMITER"
namespace_id = "2026071802"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "SOLANA_LISTENER_DO"
class_name = "SolanaListenerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SolanaListenerDO"]

[dev]
port = 8787
local_protocol = "http"

[triggers]
crons = [
  "*/2 * * * *",
  "*/5 * * * *",
  "*/15 * * * *",
  "0 * * * *",
]

# ── Staging environment ───────────────────────────────────────────────────────
# Deploy with: npx wrangler deploy --env staging
# Set secrets: npx wrangler secret put WEBHOOK_SECRET --env staging
#
# Staging uses a separate Worker name (agentpay-api-staging) and separate
# Cloudflare secrets so production secrets are never exposed in staging.
# Point STAGING_DATABASE_URL at a separate Supabase project or schema.
#
# Required secrets for staging (set via wrangler secret put --env staging):
#   DATABASE_URL, WEBHOOK_SECRET, AGENTPAY_SIGNING_SECRET, VERIFICATION_SECRET
#   TOTP_ENCRYPTION_KEY   (32-byte AES key, base64url): wrangler secret put TOTP_ENCRYPTION_KEY
#   ADMIN_SECRET_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
[env.staging]
name = "agentpay-api-staging"
# CRITICAL: routes is inheritable. Without an empty override, staging steals
# production custom domains (api.agentpay.so / agentpay.so) on every deploy.
# See: https://github.com/cloudflare/workers-sdk/issues/13925
routes = []
workers_dev = true

[env.staging.vars]
CORS_ORIGIN = "http://localhost:3000,https://apay-staging.vercel.app"
API_BASE_URL = "https://agentpay-api-staging.apaybeta.workers.dev"
FRONTEND_URL = "https://apay-staging.vercel.app"
NODE_ENV = "staging"
CARTESIA_DEFAULT_VOICE_ID = "694f9389-aac1-45b6-b726-9d9369183238"
# Provider-neutral payments — sandbox only on staging.
AGENTPAY_PAYMENT_MODE = "sandbox"
AGENTPAY_LIVE_PAYMENTS_ENABLED = "false"
AGENTPAY_PAYMENTS_ENABLED = "false"
AGENTPAY_ALLOWED_PAYMENT_PROVIDERS = "stripe,airwallex,x402"
AGENTPAY_ALLOWED_PAYMENT_CURRENCIES = "USD,GBP,EUR"
AGENTPAY_ALLOWED_PAYMENT_REDIRECT_HOSTS = "agentpay.so,app.agentpay.so,apay-staging.vercel.app,localhost"
AGENTPAY_MAX_PAYMENT_MINOR = "10000"
AGENTPAY_MAX_DAILY_PAYMENT_MINOR = "50000"
# AGENTPAY_TEST_MODE = "true"   # Uncomment to enable test-key bypass in staging

[[env.staging.ratelimits]]
name = "COMMERCE_COMPILER_SHOPPER_LIMITER"
namespace_id = "2026071811"

[env.staging.ratelimits.simple]
limit = 6
period = 60

[[env.staging.ratelimits]]
name = "COMMERCE_COMPILER_MERCHANT_LIMITER"
namespace_id = "2026071812"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[env.staging.triggers]
crons = [
  "*/15 * * * *",
]

# Note: Create a staging Hyperdrive config with:
#   npx wrangler hyperdrive create agentpay-staging --connection-string="<staging-db-url>"
# Then add:
#   [[env.staging.hyperdrive]]
#   binding = "HYPERDRIVE"
#   id = "<staging-hyperdrive-id>"
#
# Until the Hyperdrive config exists, staging can fall back to DATABASE_URL
# by removing the [[hyperdrive]] binding from the staging env section.

# Root domain — redirect to GitHub (product page)
[[routes]]
pattern = "agentpay.so"
custom_domain = true
