name: Dependency review
on:
  pull_request:
    branches: [master, main]
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dependency Review requires Dependency graph in repo settings.
      # Continue when the graph is unavailable so PRs are not blocked by settings drift.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        id: dependency-review
        with:
          comment-summary-in-pr: always
          fail-on-severity: high
      - name: Surface dependency-review outcome
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::Dependency review failed or is unsupported. Enable Dependency graph under Settings → Code security, then re-run."
