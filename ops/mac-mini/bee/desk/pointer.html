<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:transparent; pointer-events:none;
    font-family:-apple-system,'SF Pro Display',system-ui,sans-serif; }
  #ptr { position:absolute; left:0; top:0; opacity:0; will-change:left,top;
    transition:left .45s cubic-bezier(.2,.9,.2,1), top .45s cubic-bezier(.2,.9,.2,1), opacity .25s; }
  #ptr.on { opacity:1; }
  /* RIDE mode: the butterfly OWNS the cursor — track tightly, flap fast, no spotlight ring */
  #ptr.ride { transition:left .07s linear, top .07s linear, opacity .2s; }
  #ptr.ride .ring { opacity:0; }
  #ptr.ride .bf { animation:flap .22s ease-in-out infinite; }

  .ring { position:absolute; left:-26px; top:-26px; width:52px; height:52px; border-radius:50%;
    border:3px solid #ffcf5a; box-shadow:0 0 18px 4px rgba(255,176,40,.7), inset 0 0 10px rgba(255,200,90,.5);
    animation:pulse 1.2s ease-in-out infinite; transition:opacity .25s; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.95} 50%{transform:scale(1.22);opacity:.65} }

  /* the little butterfly that rides the point */
  .bf { position:absolute; left:2px; top:-6px; width:34px; height:34px; transform-origin:center;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .bf .w { transform-box:fill-box; }
  @keyframes flap { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(.46)} }

  .lbl { position:absolute; left:34px; top:-14px; white-space:nowrap; padding:5px 10px; border-radius:11px;
    background:rgba(22,22,30,.9); color:#ffe6b0; font-size:12.5px; font-weight:600; backdrop-filter:blur(10px);
    box-shadow:0 4px 16px rgba(0,0,0,.5); border:1px solid rgba(255,207,90,.4); }
  .lbl:empty{display:none}
</style></head>
<body>
  <div id="ptr">
    <div class="ring"></div>
    <svg class="bf" viewBox="0 0 40 40">
      <defs>
        <linearGradient id="pu" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffe08a"/><stop offset="60%" stop-color="#ffb02f"/><stop offset="100%" stop-color="#ff7a2f"/></linearGradient>
      </defs>
      <g class="w" style="transform-origin:20px 20px">
        <path d="M20 16 C8 4, 1 12, 4 22 C6 30, 16 26 20 20 Z" fill="url(#pu)" stroke="#c25a18" stroke-width=".9"/>
        <path d="M20 16 C32 4, 39 12, 36 22 C34 30, 24 26 20 20 Z" fill="url(#pu)" stroke="#c25a18" stroke-width=".9"/>
      </g>
      <ellipse cx="20" cy="20" rx="1.8" ry="8" fill="#3a2a14"/>
      <circle cx="20" cy="13" r="2.3" fill="#3a2a14"/>
    </svg>
    <div class="lbl" id="lbl"></div>
  </div>
<script>
  const ptr=document.getElementById('ptr'), lbl=document.getElementById('lbl');
  window.bee.onPointer((p)=>{
    if(!p || !p.active){ ptr.classList.remove('on'); return; }
    ptr.classList.toggle('ride', !!p.ride);
    ptr.style.left=p.x+'px'; ptr.style.top=p.y+'px';
    lbl.textContent=p.label||''; ptr.classList.add('on');
  });
</script>
</body></html>
