<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;cursor:crosshair}
  html,body{width:100%;height:100%;overflow:hidden;background:rgba(10,11,16,.34);
    font-family:-apple-system,'SF Pro Display',system-ui,sans-serif}
  #hud{position:fixed;left:50%;top:44px;transform:translateX(-50%);text-align:center;color:#f2f2f6;pointer-events:none;
    padding:18px 28px 16px;border-radius:18px;min-width:340px;max-width:64%;
    background:linear-gradient(180deg,rgba(30,31,40,.88),rgba(18,18,25,.9));
    backdrop-filter:blur(24px) saturate(1.35);-webkit-backdrop-filter:blur(24px) saturate(1.35);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06) inset;
    animation:hudIn .3s cubic-bezier(.2,.85,.25,1.15)}
  @keyframes hudIn{from{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
  #hud::before{content:'';position:absolute;left:20px;right:20px;top:0;height:1.5px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#f4c879,transparent);opacity:.75}
  #hud .brand{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    background:linear-gradient(135deg,#fff,#f4c879);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #hud .q{margin-top:7px;font-size:16px;font-weight:650;line-height:1.35;letter-spacing:-.1px}
  #hud .k{margin-top:11px;font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:.3px}
  #hud .k b{color:#86e0b0;font-weight:800;font-size:14px} #hud .k i{color:#ff8f7a;font-style:normal;font-weight:800;font-size:14px}
  canvas{position:fixed;inset:0}
  #verdict{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:120px;font-weight:800;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),opacity .25s}
  #verdict.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #verdict.ok{color:#86e0b0;text-shadow:0 0 40px rgba(134,224,176,.6)} #verdict.no{color:#ff8f7a;text-shadow:0 0 40px rgba(255,143,122,.6)}
</style></head>
<body>
  <div id="hud"><div class="brand">🐝 Bee · needs your nod</div>
    <div class="q" id="q">Approve this?</div>
    <div class="k">Draw <b>✓</b> to approve · <i>✗</i> (two strokes) to reject</div>
  </div>
  <canvas id="c"></canvas>
  <div id="verdict"></div>
<script src="gesture-recognizer.js"></script>
<script>
  const cv=document.getElementById('c'),x=cv.getContext('2d');
  function size(){cv.width=innerWidth;cv.height=innerHeight} size(); onresize=size;
  let strokes=[],cur=null,drawing=false,finalizeT=null,requestToken='',submitted=false;
  window.beeApproval.onRequest(d=>{ if(d&&d.label) document.getElementById('q').textContent=d.label; requestToken=d&&d.token||''; });

  function draw(){ x.clearRect(0,0,cv.width,cv.height);
    x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='rgba(255,224,160,.95)';x.shadowColor='rgba(255,200,110,.7)';x.shadowBlur=14;
    for(const s of strokes.concat(cur?[cur]:[])){ if(s.length<2)continue; x.beginPath();x.moveTo(s[0].x,s[0].y); for(const p of s)x.lineTo(p.x,p.y); x.stroke(); } }

  addEventListener('mousedown',e=>{ if(finalizeT){clearTimeout(finalizeT);finalizeT=null} drawing=true;cur=[{x:e.clientX,y:e.clientY}]; });
  addEventListener('mousemove',e=>{ if(!drawing)return; cur.push({x:e.clientX,y:e.clientY}); draw(); });
  addEventListener('mouseup',()=>{ if(!drawing)return; drawing=false; if(cur&&cur.length>2)strokes.push(cur); cur=null; draw();
    finalizeT=setTimeout(finalize,1150); });              // ✗ is two strokes — give time to draw the 2nd line before finalizing
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!submitted){ submitted=true; window.beeApproval.submit('cancel',requestToken); } });

  function finalize(){ const v=window.BeeGesture.recognize(strokes); strokes=[];
    if(!v){ draw(); return; }                              // ambiguous → let them try again
    submitted=true; show(v); setTimeout(()=>window.beeApproval.submit(v,requestToken),650); }
  function show(v){ const el=document.getElementById('verdict'); el.textContent=v==='approve'?'✓':'✗'; el.className='on '+(v==='approve'?'ok':'no'); }
</script>
</body></html>
